<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        DirectoryIndex index.php index.html

        <FilesMatch "\.php$">
            SetHandler application/x-httpd-php
        </FilesMatch>
    </Directory>

    # Block access to private directories outside public/
    <DirectoryMatch "/var/www/html/(app|storage|database|cron|tests|\.env)">
        Require all denied
    </DirectoryMatch>

    # Disable PHP engine inside storage/uploads as a defense-in-depth measure
    <Directory /var/www/html/storage>
        <FilesMatch "\.(php|phtml|php3|php4|php5|phar)$">
            Require all denied
        </FilesMatch>
        php_flag engine off
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
